
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KHARISMA Intro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: 'Orbitron', sans-serif;
    }

    .portal-circle {
      width: 160px;
      height: 160px;
      border: 4px solid #00ffcc;
      border-radius: 50%;
      animation: portalPulse 2s infinite ease-in-out;
    }

    .text {
      position: absolute;
      top: 60%;
      font-size: 1.2em;
      opacity: 0;
      animation: fadeText 2s ease-in-out 1.5s forwards;
      text-align: center;
    }

    @keyframes portalPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.6;
      }
    }

    @keyframes fadeText {
      to {
        opacity: 1;
      }
    }
  </style>
  <script>
    setTimeout(() => {
      window.location.href = "index.html";
    }, 4000);
  </script>
</head>
<body>
  <div class="portal-circle"></div>
  <div class="text">Find what can't be seen.</div>
</body>
</html>
