
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join the Circle - KHARISMA</title>
  <link rel="stylesheet" href="style.css">
  <script src="submit.js" defer></script>
  <style>
    .glitch {
      color: white;
      font-size: 2.2em;
      position: relative;
      display: inline-block;
      animation: glitch 1.2s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 2px red, -2px -2px blue; }
      20% { text-shadow: -2px 0 red, 2px 2px blue; }
      40% { text-shadow: 2px -2px red, -2px 2px blue; }
      60% { text-shadow: -1px 2px red, 2px -1px blue; }
      80% { text-shadow: 2px 1px red, -1px -2px blue; }
      100% { text-shadow: -2px -2px red, 2px 2px blue; }
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 40px;
      width: 100%;
      max-width: 400px;
    }

    input, textarea {
      padding: 10px;
      border: none;
      background-color: #111;
      color: #fff;
      border-bottom: 2px solid #fff;
      font-size: 1em;
    }

    .surrender-btn {
      background: none;
      border: 2px solid white;
      color: white;
      padding: 12px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s ease;
      animation: pulse 2s infinite ease-in-out;
    }

    .surrender-btn:hover {
      background: white;
      color: black;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #success {
      display: none;
      margin-top: 40px;
      font-size: 1.2em;
      animation: fadeIn 1.4s ease forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="background-smoke"></div>
  <div class="container">
    <div class="glitch">Join the Circle</div>
    <form id="rsvp-form" class="form-container">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <textarea id="message" placeholder="Message (optional)" rows="4"></textarea>
      <button type="submit" class="surrender-btn">SURRENDER</button>
    </form>
    <div id="success">You’ve entered the circle. We’ll find you.</div>
  </div>
</body>
</html>
