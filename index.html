
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KHARISMA</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="noise-overlay"></div>
  <div class="container">
    <div class="logo">
      <img src="logo_kharrisma.png" alt="KHARISMA Logo" />
    </div>
    <h1 class="title glitch" data-text="KHARISMA">KHARISMA</h1>
    <p class="tagline">Find what you can't see.</p>
    <a href="#form" class="cta-button">JOIN THE CIRCLE</a>

    <form id="form" class="signup-form">
      <input type="text" name="name" placeholder="Name" required/>
      <input type="email" name="email" placeholder="Email" required/>
      <textarea name="message" placeholder="Message or vibes..." rows="3"></textarea>
      <button type="submit">SUBMIT</button>
    </form>
  </div>
</body>
</html>
